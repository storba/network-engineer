# Full assignment topology from network-engineer-assignment.pdf
#
#                         INTERNET
#                             |
#                      central_router
#                     /              \
#            IPsec overlay      VXLAN overlay
#                   /                  \
#          edge_router_a            edge_router_b
#           /        \               /        \
#     Subnet1A    Subnet2A     Subnet1B    Subnet2B
#    192.168.2.0  192.168.1.0  192.168.4.0  192.168.3.0
#
# Docker bridge gateways use .254 so routers can own .1 / WAN P2P IPs.
# Networks are listed alphabetically: Docker attaches them in that order,
# and config.boot assigns eth0, eth1, ... to match.

name: site-to-site

x-router: &router
  image: afla/vyos:1.4
  privileged: true
  sysctls:
    net.ipv4.ip_forward: "1"
  depends_on:
    - allow_bridged

x-host: &host
  build:
    context: ./hosts
  cap_add:
    - NET_ADMIN

services:
  # Internal Docker bridges drop off-subnet dest IPs. Accept bridged
  # frames so a VyOS router can forward between lab subnets.
  allow_bridged:
    build:
      context: ./bridge-filter
    container_name: allow_bridged
    network_mode: host
    cap_add:
      - NET_ADMIN

  central_router:
    <<: *router
    container_name: central_router
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./vyos/central:/opt/vyatta/etc/config
    networks:
      net_internet:
        ipv4_address: 203.0.113.1
      net_mgmt:
        ipv4_address: 10.0.0.1
      net_wan_a:
        ipv4_address: 1.1.1.2
      net_wan_b:
        ipv4_address: 1.1.2.2

  edge_router_a:
    <<: *router
    container_name: edge_router_a
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./vyos/edge-a:/opt/vyatta/etc/config
    networks:
      net_mgmt:
        ipv4_address: 10.0.0.2
      net_subnet1a:
        ipv4_address: 192.168.2.1
      net_subnet2a:
        ipv4_address: 192.168.1.1
      net_wan_a:
        ipv4_address: 1.1.1.1

  edge_router_b:
    <<: *router
    container_name: edge_router_b
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./vyos/edge-b:/opt/vyatta/etc/config
    networks:
      net_mgmt:
        ipv4_address: 10.0.0.3
      net_subnet1b:
        ipv4_address: 192.168.4.1
      net_subnet2b:
        ipv4_address: 192.168.3.1
      net_wan_b:
        ipv4_address: 1.1.2.1

  host_1a_1:
    <<: *host
    container_name: host_1a_1
    environment:
      GATEWAY: 192.168.2.1
    networks:
      net_subnet1a:
        ipv4_address: 192.168.2.10
    depends_on: [edge_router_a]

  host_1a_2:
    <<: *host
    container_name: host_1a_2
    environment:
      GATEWAY: 192.168.2.1
    networks:
      net_subnet1a:
        ipv4_address: 192.168.2.11
    depends_on: [edge_router_a]

  host_2a_1:
    <<: *host
    container_name: host_2a_1
    environment:
      GATEWAY: 192.168.1.1
    networks:
      net_subnet2a:
        ipv4_address: 192.168.1.10
    depends_on: [edge_router_a]

  host_2a_2:
    <<: *host
    container_name: host_2a_2
    environment:
      GATEWAY: 192.168.1.1
    networks:
      net_subnet2a:
        ipv4_address: 192.168.1.11
    depends_on: [edge_router_a]

  host_1b_1:
    <<: *host
    container_name: host_1b_1
    environment:
      GATEWAY: 192.168.4.1
    networks:
      net_subnet1b:
        ipv4_address: 192.168.4.10
    depends_on: [edge_router_b]

  host_1b_2:
    <<: *host
    container_name: host_1b_2
    environment:
      GATEWAY: 192.168.4.1
    networks:
      net_subnet1b:
        ipv4_address: 192.168.4.11
    depends_on: [edge_router_b]

  host_2b_1:
    <<: *host
    container_name: host_2b_1
    environment:
      GATEWAY: 192.168.3.1
    networks:
      net_subnet2b:
        ipv4_address: 192.168.3.10
    depends_on: [edge_router_b]

  host_2b_2:
    <<: *host
    container_name: host_2b_2
    environment:
      GATEWAY: 192.168.3.1
    networks:
      net_subnet2b:
        ipv4_address: 192.168.3.11
    depends_on: [edge_router_b]

  provisioner:
    build:
      context: ./provisioner
    container_name: provisioner
    volumes:
      - ./config.yml:/config.yml:ro
    environment:
      CONFIG: /config.yml
    networks:
      net_mgmt:
        ipv4_address: 10.0.0.10
    depends_on:
      - central_router
      - edge_router_a
      - edge_router_b

networks:
  net_internet:
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.254

  net_mgmt:
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.254

  # Assignment WAN is 1.1.1.0/30; Docker uses /24 so .1 and .2 are free.
  net_wan_a:
    internal: true
    ipam:
      config:
        - subnet: 1.1.1.0/24
          gateway: 1.1.1.254

  net_wan_b:
    internal: true
    ipam:
      config:
        - subnet: 1.1.2.0/24
          gateway: 1.1.2.254

  net_subnet1a:
    internal: true
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.254

  net_subnet2a:
    internal: true
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254

  net_subnet1b:
    internal: true
    ipam:
      config:
        - subnet: 192.168.4.0/24
          gateway: 192.168.4.254

  net_subnet2b:
    internal: true
    ipam:
      config:
        - subnet: 192.168.3.0/24
          gateway: 192.168.3.254
